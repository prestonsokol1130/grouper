[package]
name = "grouper"
version = "0.1.0"
description = "Windows 11 tray utility for taskbar app groups and Launchpad"
authors = ["Preston Sokol <prestonsokol1130@gmail.com>"]
edition = "2021"

[lib]
name = "grouper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
# Multi-size .ico encoding for taskbar group icons.
ico = "0.6"
# PNG decoding (the embedded fallback icon) and Lanczos3 resizing (imageops).
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Environment",
  # SHELLEXECUTEINFOW has an HKEY field, so ShellExecuteExW needs Registry.
  "Win32_System_Registry",
  "Win32_UI_Shell",
  # COMDLG_FILTERSPEC, for IFileDialog::SetFileTypes.
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

# Test-only Win32 APIs: GetCurrentProcess and GetGuiResources (GDI leak tests).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
