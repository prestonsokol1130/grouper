name: Polish / UI tweak
description: It works, but it looks or feels off.
title: "[Polish] "
labels: ["polish"]
body:
  - type: markdown
    attributes:
      value: |
        **For agents:** `DESIGN.md` and the Design spec in [Specs](https://app.notion.com/p/40073b0b9f9381a4a1add7ea9b93876c) are the visual source of truth. If this issue has a Spec link or Build log entry, open those first. Agent rules are in `AGENTS.md`.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicates
      options:
        - label: I searched open and closed issues and this is not already reported.
          required: true
  - type: input
    id: element
    attributes:
      label: Screen or element
      placeholder: Flyout page dots
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What it looks like now
      description: Drag in a screenshot.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should look like
      description: Describe it, or drag in a mockup or reference.
    validations:
      required: true
  - type: input
    id: spec-link
    attributes:
      label: Spec link
      description: Link to the exact Notion spec page or section this is about. Find it under [Specs](https://app.notion.com/p/40073b0b9f9381a4a1add7ea9b93876c).
      placeholder: https://app.notion.com/p/...
  - type: input
    id: build-log-link
    attributes:
      label: Build log entry
      description: Link to the Notion Build Log row for the build or PR this relates to. Find it in the [Build Log](https://app.notion.com/p/a606963ead3646718f1d74ead7b7ecce).
      placeholder: https://app.notion.com/p/...
