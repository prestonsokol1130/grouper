name: Polish / UI tweak
description: It works, but it looks or feels off.
title: "[Polish] "
labels: ["polish"]
body:
  - type: markdown
    attributes:
      value: |
        **For agents:** `DESIGN.md` and the Design spec in [Specs](https://app.notion.com/p/40073b0b9f9381a4a1add7ea9b93876c) are the visual source of truth. Agent rules are in `AGENTS.md`.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicates
      options:
        - label: I searched open and closed issues and this is not already reported.
          required: true
  - type: input
    id: element
    attributes:
      label: Screen or element
      placeholder: Flyout page dots
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What it looks like now
      description: Drag in a screenshot.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should look like
      description: Describe it, or drag in a mockup or reference.
    validations:
      required: true
