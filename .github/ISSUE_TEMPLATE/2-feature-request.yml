name: Feature request
description: A new capability or behavior for Grouper.
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        **For agents:** check the [Specs](https://app.notion.com/p/40073b0b9f9381a4a1add7ea9b93876c) and `DESIGN.md` before building. New user-visible behavior needs Preston's decision first. Agent rules are in `AGENTS.md`.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicates
      options:
        - label: I searched open and closed issues and this is not already requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem or wish
      description: In plain words, what you want to do or what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it should work
      description: Your idea for the behavior, step by step if it helps.
    validations:
      required: true
  - type: dropdown
    id: setting
    attributes:
      label: Should it be a setting?
      options:
        - "No, always on"
        - "Yes, on by default"
        - "Yes, off by default"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: mockup
    attributes:
      label: Mockup or reference app
      description: Sketch, screenshot, or an app that already does this well.
