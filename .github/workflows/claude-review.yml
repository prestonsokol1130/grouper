name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Only the newest commit on a pull request gets reviewed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Read AGENTS.md first; its rules are binding for this repo.

            Focus on real problems only:
            - bugs and wrong behaviour, including edge cases and races
            - breaks of AGENTS.md rules (no unwrap/expect/panic in runtime
              Rust, SAFETY comments on unsafe, files under 250 lines,
              Win32 behind cfg(windows), COM through ComGuard)
            - resource leaks (handles, GDI objects, COM) and unsafe misuse
            - missing tests for new logic

            Skip style nits that formatters or linters already catch.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for each specific issue, and one
            `gh pr comment` with a short summary. Start the summary with
            "CLAUDE REVIEW: PASS" if you found nothing that must change,
            or "CLAUDE REVIEW: CHANGES" followed by a numbered list.
            Only post GitHub comments; don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
