name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The release workflow runs this whole suite before it builds.
  workflow_call:

# Cancel a run when a newer commit lands on the same pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier formatting
        shell: bash
        run: |
          if ! pnpm format:check; then
            echo "::error::Formatting check failed. Run \`pnpm format\` to fix it."
            exit 1
          fi

      - name: Check file length
        run: pnpm check:loc

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Install typos and cargo-machete
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: typos@1.51.1,cargo-machete

      - name: Unused files, exports and dependencies (Knip)
        run: pnpm knip

      - name: Spelling (typos)
        run: typos

      - name: Frontend unit tests (Vitest)
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        shell: bash
        run: |
          if ! cargo fmt --check; then
            echo "::error::Formatting check failed. Run \`cargo fmt\` to fix it."
            exit 1
          fi

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Unused Rust dependencies (cargo-machete)
        working-directory: src-tauri
        run: cargo machete
